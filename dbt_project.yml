name: "hino"
version: "1.0.0"

profile: "hino"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros", "shared/macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  hino:
    +database: hino
    ods:
      raw:
        +materialized: table
      stg:
        +materialized: view
      # mart は実体化する。view だと ods_geometry の st_point が読むたびに評価され、
      # spatial 拡張を読み込んでいないブラウザの DuckDB からは統計も SQL も通らない
      mart:
        +materialized: table
