# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・AI 向けの説明・列の意味）は annotations.queria に書く。
name: hino
title: 日野市オープンデータ
description: |-
  東京都日野市が公開する自治体標準オープンデータセット 18 種類（公共施設・AED・緊急避難場所・介護サービス事業所・子育て施設・文化財・投票所・ゴミの分別方法など）です。列名は metro_tokyo の ods スキーマと同じなので、都内の自治体と並べて集計できます。

  出典：日野市オープンデータ（CC BY 4.0）を加工して作成。
keywords:
  - オープンデータ
  - 日野市
  - 東京都
  - 多摩地域
  - 自治体標準オープンデータセット
  - 公共施設
  - 防災
  - GIS
homepage: https://github.com/queria-io/dataset-hino
language: ja

licenses:
  - CC-BY-4.0

sources:
  - title: 日野市オープンデータ
    path: https://www.city.hino.lg.jp/opendata/

contributors:
  - title: 日野市
    path: https://www.city.hino.lg.jp/
    roles: [rightsHolder]

temporal_coverage: { start: "2022-04-01", end: "2024-03-28" }
spatial_coverage: [JP]
update_frequency: irregular

schemas:
  - name: ods
    title: 自治体標準オープンデータセット
annotations:
  queria:
    themes: [justice_safety_environment, education_culture, government_finance, social_security_health, ict_science, population, transport_tourism]
    cover: 🏞️
