# 日野市が公開する自治体標準オープンデータセットの取り込み定義。
#
# 日野市のオープンデータカタログは CKAN ではなく自前 CGI で、機械可読な一覧の
# 出口が無い。そのため種別の判定はせず、公開ページと CSV の URL を直接持つ。
# URL が変わったらここを直す。
#
# columns[].source は照合するヘッダー名を優先順に並べたもので、先にマッチした
# 列を採用する。日野市は定義書 A/B の様式で公開しているが、旧推奨データセット
# 形式のヘッダーも残してあるのは、上流が様式を差し替えても拾えるようにするため。
# どの標準キーにもマッチしないヘッダーの値は _extras に退避する。
#
# facility_url を持つ種別は、定義書 B の施設・設備分離型で公開されていて
# 本体ファイルが住所と座標を持たない。併走する 132128_facility.csv を
# 施設_ID で結合して補う（結合は本体側が空の列だけを埋め、既存値は上書きしない）。
#
# as_of は日野市がページに掲げている「データ時点」。ファイルの取得日ではない。

facility_columns:
- key: facility_id
  source:
  - 施設_ID
- key: facility_name
  source:
  - 施設_名称
- key: poi_code
  source:
  - 施設_POIコード
- key: address
  source:
  - 住所_連結表記
- key: prefecture
  source:
  - 住所_都道府県
- key: city
  source:
  # 施設情報ファイルは「住所_市区町村（郡）」と「住所_市区町村」の両方の列を持つが、
  # 値が入っているのは前者だけ（2026-09-11 時点の実測）
  - 住所_市区町村（郡）
  - 住所_市区町村
- key: town
  source:
  - 住所_町字
- key: town_id
  source:
  - 住所_町字ID
- key: street_number
  source:
  - 住所_番地以下
- key: building_name
  source:
  - 住所_建物名等(方書)
- key: postal_code
  source:
  - 連絡先_郵便番号
- key: phone_number
  source:
  - 連絡先_電話番号
- key: facility_lat
  source:
  - 住所_緯度
- key: facility_lon
  source:
  - 住所_経度
- key: available_days
  source:
  - 施設_サービス曜日
- key: start_time
  source:
  - 施設_開始時刻
- key: end_time
  source:
  - 施設_終了時刻
- key: available_notes
  source:
  - 施設_日時備考
- key: url
  source:
  - 施設_URL
