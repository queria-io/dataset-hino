schema: ods
name: fire_hydrant
title: 消防水利施設
description: |-
  日野市が公開する「消防水利施設一覧」（自治体標準オープンデータセット）です。1 行が 1 水利で、消火栓・防火水槽などの位置と口径を持ちます。データ時点は 2024-03-28 です。

  - 原典の公開件数が 2 件です
keywords:
- 日野市
- 東京都
- 防災
- 消防
- 消火栓
- 自治体標準オープンデータセット
- GIS
annotations: { queria: { themes: [justice_safety_environment] } }
sources:
- path: https://www.city.hino.lg.jp/opendata/about/1026816/1026910.html
fields:
- name: municipality_code
  title: 全国地方公共団体コード
  description: 非推奨。local_government_code を使う
  annotations: { queria: { semantic: { role: dimension } } }
- name: facility_id
  title: ID
  description: 自治体内で一意の施設 ID（元データの ID / NO 列）。付番していない自治体は NULL
- name: facility_type
  title: 種別
  description: 水利の種類（消火栓・防火水槽など。表記は原典のまま）
- name: organization_name
  title: 地方公共団体名
- name: address
  title: 所在地
  description: 非推奨。full_address を使う
  annotations: { queria: { semantic: { role: dimension } } }
- name: prefecture
  title: 所在地_都道府県
- name: city
  title: 所在地_市区町村
- name: town
  title: 所在地_町字
- name: street_number
  title: 所在地_番地以下
- name: building_name
  title: 建物名等（方書）
- name: town_id
  title: 町字ID
  description: 非推奨。street_address_id を使う
  annotations: { queria: { semantic: { role: dimension } } }
- name: location_municipality_code
  title: 所在地_全国地方公共団体コード
  description: 水利の所在地の6桁コード。管轄外にある場合は管理主体のコードと異なる
  annotations: { queria: { semantic: { role: entity, name: city } } }
- name: lat
  title: 緯度
  description: 非推奨。latitude を使う
  annotations: { queria: { semantic: { role: dimension } } }
- name: lon
  title: 経度
  description: 非推奨。longitude を使う
  annotations: { queria: { semantic: { role: dimension } } }
- name: geo_lat
  title: 緯度（地図表示用）
  description: 地図表示用の緯度（Queria が付与）。由来は geo_source
- name: geo_lon
  title: 経度（地図表示用）
  description: Queria が付与。geo_lat と対になる経度
- name: geo_source
  title: 座標の由来
  description: source=原典のまま、source_swapped=緯度と経度を入れ替えた値、NULL=座標なし
- name: geo_level
  title: 座標の粒度
  description: 原典由来のため source 固定
- name: geometry
  title: ジオメトリ
  description: Queria が付与。geo_lat / geo_lon から作った POINT。座標が無い行は NULL
- name: diameter
  title: 口径
  description: 対応する口径（ミリメートル）。記載のない水利は NULL
- name: notes
  title: 備考
- name: extras
  title: 追加列
  description: 標準列にマッピングできなかった元データの列（JSON）
- name: as_of
  title: データ時点
  description: 日野市が公開ページに掲げている値。取得日ではない
- name: source_url
  title: 取得元URL
- name: source_page
  title: 公開ページ
  description: 日野市サイト上の、このデータの公開ページ
- name: local_government_code
  title: 全国地方公共団体コード
  description: 情報の管理主体の6桁の全国地方公共団体コード
  annotations: { queria: { semantic: { role: entity, name: city } } }
- name: full_address
  title: 所在地
  description: 所在地の連結表記（旧形式の「住所」列を含む）
- name: latitude
  title: 緯度
- name: longitude
  title: 経度
- name: street_address_id
  title: 町字ID
  description: アドレス・ベース・レジストリの町字ID（記載している自治体のみ）
  annotations: { queria: { semantic: { role: entity, name: town } } }
