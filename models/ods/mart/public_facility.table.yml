schema: ods
name: public_facility
title: 公共施設
description: |-
  日野市が公開する「公共施設一覧」（自治体標準オープンデータセット）です。公民館・図書館・体育館などの名称・所在地・連絡先・利用可能時間・アクセス方法を持ちます。データ時点は 2024-03-28 です。

  - バリアフリー設備など標準にない列は extras（JSON）にあります
keywords:
- 日野市
- 東京都
- 公共施設
- 自治体標準オープンデータセット
- GIS
published: true
themes: [government_finance]
sources:
- path: https://www.city.hino.lg.jp/opendata/about/1026816/1026807.html
fields:
- name: municipality_code
  title: 全国地方公共団体コード
  description: 非推奨。local_government_code を使う
  semantic: { role: dimension }
- name: facility_id
  title: ID
  description: 日野市が採番した施設 ID。施設情報ファイルとの結合キー
- name: name
  title: 名称
- name: name_kana
  title: 名称カナ
- name: name_alias
  title: 名称通称
- name: poi_code
  title: POIコード
- name: address
  title: 所在地
  description: 非推奨。full_address を使う
  semantic: { role: dimension }
- name: prefecture
  title: 都道府県
- name: city
  title: 市区町村
- name: postal_code
  title: 郵便番号
  semantic: { role: entity, name: postal_code }
- name: phone_number
  title: 電話番号
- name: lat
  title: 緯度
  description: 非推奨。latitude を使う
  semantic: { role: dimension }
- name: lon
  title: 経度
  description: 非推奨。longitude を使う
  semantic: { role: dimension }
- name: geo_lat
  title: 緯度（地図表示用）
  description: 地図表示用の緯度（Queria が付与）。由来は geo_source
- name: geo_lon
  title: 経度（地図表示用）
  description: Queria が付与。geo_lat と対になる経度
- name: geo_source
  title: 座標の由来
  description: source=原典のまま、source_swapped=緯度と経度を入れ替えた値、NULL=座標なし
- name: geo_level
  title: 座標の粒度
  description: 原典由来のため source 固定
- name: geometry
  title: ジオメトリ
  description: Queria が付与。geo_lat / geo_lon から作った POINT。座標が無い行は NULL
- name: corporate_number
  title: 法人番号
  description: 非推奨。legal_entity_number を使う
  semantic: { role: dimension }
- name: corporate_name
  title: 団体名
  description: 運営主体（指定管理者等）の名称
- name: available_days
  title: 利用可能曜日
- name: start_time
  title: 開始時間
- name: end_time
  title: 終了時間
- name: available_notes
  title: 利用可能日時特記事項
- name: access
  title: アクセス方法
- name: parking
  title: 駐車場情報
- name: description
  title: 説明
- name: url
  title: URL
- name: notes
  title: 備考
- name: extras
  title: 追加列
  description: 標準列にマッピングできなかった元データの列（JSON）
- name: as_of
  title: データ時点
  description: 日野市が公開ページに掲げている値。取得日ではない
- name: source_url
  title: 取得元URL
- name: source_page
  title: 公開ページ
  description: 日野市サイト上の、このデータの公開ページ
- name: local_government_code
  title: 全国地方公共団体コード
  description: 6桁の全国地方公共団体コード（元データの表記のまま。5桁の場合もある）
  semantic: { role: entity, name: city }
- name: full_address
  title: 所在地
  description: 所在地の連結表記（旧形式の「住所」列を含む）
- name: latitude
  title: 緯度
- name: longitude
  title: 経度
- name: legal_entity_number
  title: 法人番号
  semantic: { role: entity, name: corporate_number }
