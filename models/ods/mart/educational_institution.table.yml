schema: ods
name: educational_institution
title: 教育機関
description: |-
  日野市が公開する「教育機関一覧」（自治体標準オープンデータセット）です。幼稚園・小学校・中学校などの学校種・設置区分・所在地・位置・連絡先を持ちます。データ時点は 2024-03-28 です。

  - 学校種の表記は原典のままです
keywords:
- 日野市
- 東京都
- 教育
- 学校
- 自治体標準オープンデータセット
- GIS
annotations: { queria: { themes: [education_culture] } }
sources:
- path: https://www.city.hino.lg.jp/opendata/about/1026816/1026913.html
fields:
- name: school_code
  title: 学校コード
- name: school_type
  title: 学校種
  description: 幼稚園・小学校・中学校等の種別。統制コード（A1・B1 等）と日本語ラベルが混在
- name: prefecture_code
  title: 都道府県番号
  annotations: { queria: { semantic: { role: entity, name: prefecture } } }
- name: establishment_category
  title: 設置区分
  description: 国立・公立・私立等の区分
- name: establisher
  title: 設置者情報
- name: branch_type
  title: 本分校
  description: 本校・分校の区別
- name: main_school_code
  title: 本校学校コード
- name: main_school_name
  title: 本校学校名
- name: name
  title: 名称
  description: 学校・教育機関の名称
- name: name_kana
  title: 名称カナ
- name: name_alias
  title: 略称
- name: city
  title: 市区町村
  description: 所在地の市区町村
- name: town
  title: 町字
  description: 所在地の町字
- name: street_number
  title: 番地以下
  description: 所在地の番地以下
- name: postal_code
  title: 郵便番号
  annotations: { queria: { semantic: { role: entity, name: postal_code } } }
- name: lat
  title: 緯度
  description: 非推奨。latitude を使う
  annotations: { queria: { semantic: { role: dimension } } }
- name: lon
  title: 経度
  description: 非推奨。longitude を使う
  annotations: { queria: { semantic: { role: dimension } } }
- name: geo_lat
  title: 緯度（地図表示用）
  description: 地図表示用の緯度（Queria が付与）。由来は geo_source
- name: geo_lon
  title: 経度（地図表示用）
  description: Queria が付与。geo_lat と対になる経度
- name: geo_source
  title: 座標の由来
  description: source=原典のまま、source_swapped=緯度と経度を入れ替えた値、NULL=座標なし
- name: geo_level
  title: 座標の粒度
  description: 原典由来のため source 固定
- name: geometry
  title: ジオメトリ
  description: Queria が付与。geo_lat / geo_lon から作った POINT。座標が無い行は NULL
- name: contact_name
  title: 連絡先名称
- name: phone_number
  title: 電話番号
- name: attribute_set_date
  title: 属性情報設定年月日
- name: attribute_abolished_date
  title: 属性情報廃止年月日
- name: old_survey_number
  title: 旧学校調査番号
- name: new_school_code
  title: 移行後の学校コード
- name: extras
  title: 追加列
  description: 標準列にマッピングできなかった元データの列（JSON）
- name: as_of
  title: データ時点
  description: 日野市が公開ページに掲げている値。取得日ではない
- name: source_url
  title: 取得元URL
- name: source_page
  title: 公開ページ
  description: 日野市サイト上の、このデータの公開ページ
- name: latitude
  title: 緯度
- name: longitude
  title: 経度
