- name: cultural_property
  description: 日野市が公開する「文化財一覧」（自治体標準オープンデータセット）。文化財保護法および市の文化財保護条例に基づき指定・登録された文化財を、分類・種類・所有者・指定日・所在地とともに収録する。無形文化財や個人所有で住所非公開のものを含むため、緯度経度が入らない行がある。データ時点は
    2024-03-28（日野市が公開ページに掲げている値）。
