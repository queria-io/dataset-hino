- name: population
  description: 日野市が公開する「地域・年齢別人口」（自治体標準オープンデータセット）。1行 = 地域 × 調査年月日で、総人口・男女別人口に加えて5歳階級×男女の人口（0-4歳〜85歳以上）と世帯数をワイドに持つ。日野市の月次の人口統計は
    Excel で別に公開されており、当テーブルとは収録時点が異なる。データ時点は 2022-04-01（日野市が公開ページに掲げている値）。
