- name: evacuation_space
  description: 日野市が公開する「緊急避難場所一覧」（自治体標準オープンデータセット）。災害対策基本法に基づき市長が指定する、切迫した災害の危険から逃れるための緊急避難場所。災害種別ごとの対応可否を BOOLEAN
    で持つ。全国網羅の類似データとして gsi.emergency_evacuation_site（国土地理院）がある。データ時点は 2024-03-28（日野市が公開ページに掲げている値）。
