schema: ods
name: care_service
title: 介護サービス事業所
description: |-
  日野市が公開する「介護サービス事業所一覧」（自治体標準オープンデータセット）です。1 行が 1 事業所で、実施サービス・所在地・定員・運営法人を持ちます。データ時点は 2024-03-28 です。

  - 全国の事業所は mhlw.kaigo.establishment にあります
keywords:
- 日野市
- 東京都
- 介護
- 高齢者
- 福祉
- 自治体標準オープンデータセット
- GIS
published: true
themes: [social_security_health]
sources:
- path: https://www.city.hino.lg.jp/opendata/about/1026816/1026906.html
fields:
- name: municipality_code
  title: 全国地方公共団体コード
  description: 非推奨。local_government_code を使う
  semantic: { role: dimension }
- name: facility_id
  title: ID
  description: 日野市が採番した施設 ID。施設情報ファイルとの結合キー
- name: name
  title: 介護サービス事業所名称
- name: name_kana
  title: 名称カナ
- name: name_en
  title: 名称英字
- name: service_type
  title: 実施サービス
  description: 提供する介護サービス（表記は原典のまま）
- name: address
  title: 所在地
  description: 非推奨。full_address を使う
  semantic: { role: dimension }
- name: prefecture
  title: 都道府県
- name: city
  title: 市区町村
- name: town
  title: 所在地_町字
- name: street_number
  title: 所在地_番地以下
- name: building_name
  title: 建物名等（方書）
- name: town_id
  title: 町字ID
  description: 非推奨。street_address_id を使う
  semantic: { role: dimension }
- name: location_municipality_code
  title: 所在地_全国地方公共団体コード
  description: 事業所の所在地の全国地方公共団体コード。管轄外にある場合は管理主体のコードと異なる
  semantic: { role: entity, name: city }
- name: postal_code
  title: 郵便番号
  semantic: { role: entity, name: postal_code }
- name: phone_number
  title: 電話番号
- name: fax_number
  title: FAX番号
- name: lat
  title: 緯度
  description: 非推奨。latitude を使う
  semantic: { role: dimension }
- name: lon
  title: 経度
  description: 非推奨。longitude を使う
  semantic: { role: dimension }
- name: geo_lat
  title: 緯度（地図表示用）
  description: 地図表示用の緯度（Queria が付与）。由来は geo_source
- name: geo_lon
  title: 経度（地図表示用）
  description: Queria が付与。geo_lat と対になる経度
- name: geo_source
  title: 座標の由来
  description: source=原典のまま、source_swapped=緯度と経度を入れ替えた値、NULL=座標なし
- name: geo_level
  title: 座標の粒度
  description: 原典由来のため source 固定
- name: geometry
  title: ジオメトリ
  description: Queria が付与。geo_lat / geo_lon から作った POINT。座標が無い行は NULL
- name: corporate_number
  title: 法人番号
  description: 非推奨。legal_entity_number を使う
  semantic: { role: dimension }
- name: corporate_name
  title: 法人の名称
- name: business_number
  title: 事業所番号
  description: 介護保険事業所番号（記載している自治体のみ）
- name: available_days
  title: 利用可能曜日
- name: available_notes
  title: 利用可能曜日特記事項
- name: capacity
  title: 定員
  description: サービスの定員。記載のない事業所は NULL
- name: url
  title: URL
- name: notes
  title: 備考
- name: extras
  title: 追加列
  description: 標準列にマッピングできなかった元データの列（JSON）
- name: as_of
  title: データ時点
  description: 日野市が公開ページに掲げている値。取得日ではない
- name: source_url
  title: 取得元URL
- name: source_page
  title: 公開ページ
  description: 日野市サイト上の、このデータの公開ページ
- name: local_government_code
  title: 全国地方公共団体コード
  description: 情報の管理主体の全国地方公共団体コード（元データの表記のまま。5桁の場合もある）
  semantic: { role: entity, name: city }
- name: full_address
  title: 所在地
  description: 所在地の連結表記（旧形式の「住所」列を含む）
- name: latitude
  title: 緯度
- name: longitude
  title: 経度
- name: legal_entity_number
  title: 法人番号
  description: 運営主体の法人番号（記載している自治体のみ）。houjin_bangou と結合可能
  semantic: { role: entity, name: corporate_number }
- name: street_address_id
  title: 町字ID
  description: アドレス・ベース・レジストリの町字ID（記載している自治体のみ）
  semantic: { role: entity, name: town }
