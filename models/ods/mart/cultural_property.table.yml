schema: ods
name: cultural_property
title: 文化財
description: |-
  日野市が公開する「文化財一覧」（自治体標準オープンデータセット）です。指定・登録された文化財の分類・種類・所有者・指定日・所在地を持ちます。データ時点は 2024-03-28 です。

  - 無形文化財や住所非公開のものは位置がありません
keywords:
- 日野市
- 東京都
- 文化財
- 歴史
- 観光
- 自治体標準オープンデータセット
- GIS
annotations: { queria: { themes: [education_culture] } }
sources:
- path: https://www.city.hino.lg.jp/opendata/about/1026816/1026808.html
fields:
- name: municipality_code
  title: 全国地方公共団体コード
  description: 非推奨。local_government_code を使う
  annotations: { queria: { semantic: { role: dimension } } }
- name: facility_id
  title: ID
  description: 日野市が採番した施設 ID。施設情報ファイルとの結合キー
- name: name
  title: 名称
- name: name_kana
  title: 名称カナ
- name: name_alias
  title: 名称_通称
- name: name_en
  title: 名称_英語
- name: property_class
  title: 文化財分類
  description: 重要文化財・都指定文化財・区登録有形文化財など。複数指定は「;」区切り
- name: property_type
  title: 種類
  description: 建造物・美術工芸品・無形民俗文化財・考古資料など
- name: place_name
  title: 場所名称
  description: 文化財が設置されている施設・建物などの名称
- name: address
  title: 所在地
  description: 非推奨。full_address を使う
  annotations: { queria: { semantic: { role: dimension } } }
- name: prefecture
  title: 都道府県
- name: city
  title: 市区町村
- name: building_name
  title: 建物名等(方書)
- name: postal_code
  title: 郵便番号
  annotations: { queria: { semantic: { role: entity, name: postal_code } } }
- name: phone_number
  title: 電話番号
- name: lat
  title: 緯度
  description: 非推奨。latitude を使う
  annotations: { queria: { semantic: { role: dimension } } }
- name: lon
  title: 経度
  description: 非推奨。longitude を使う
  annotations: { queria: { semantic: { role: dimension } } }
- name: geo_lat
  title: 緯度（地図表示用）
  description: 地図表示用の緯度（Queria が付与）。由来は geo_source
- name: geo_lon
  title: 経度（地図表示用）
  description: Queria が付与。geo_lat と対になる経度
- name: geo_source
  title: 座標の由来
  description: source=原典のまま、source_swapped=緯度と経度を入れ替えた値、NULL=座標なし
- name: geo_level
  title: 座標の粒度
  description: 原典由来のため source 固定
- name: geometry
  title: ジオメトリ
  description: Queria が付与。geo_lat / geo_lon から作った POINT。座標が無い行は NULL
- name: quantity
  title: 員数（数）
  description: 数値化できない表記は NULL
- name: quantity_unit
  title: 員数（単位）
  description: 棟・基・幅・軀・双など
- name: corporate_number
  title: 法人番号
  description: 非推奨。legal_entity_number を使う
  annotations: { queria: { semantic: { role: dimension } } }
- name: owner
  title: 所有者等
  description: 所有者・管理者・保護団体等。個人所有は「個人」と記載される
- name: designated_date
  title: 文化財指定日
  description: 原典の文字列のまま。日不明を 99 で埋める表記（1982-04-99 等）があるため日付型にしていない
- name: available_days
  title: 利用可能曜日
  description: 公開している文化財のみ
- name: start_time
  title: 開始時間
- name: end_time
  title: 終了時間
- name: available_notes
  title: 利用可能日時特記事項
- name: image
  title: 画像
  description: 画像の格納先 URL
- name: image_license
  title: 画像_ライセンス
- name: summary
  title: 概要
- name: summary_en
  title: 概要_英語
- name: description
  title: 説明
- name: description_en
  title: 説明_英語
- name: url
  title: URL
- name: notes
  title: 備考
- name: extras
  title: 追加列
  description: 標準列にマッピングできなかった元データの列（JSON）
- name: as_of
  title: データ時点
  description: 日野市が公開ページに掲げている値。取得日ではない
- name: source_url
  title: 取得元URL
- name: source_page
  title: 公開ページ
  description: 日野市サイト上の、このデータの公開ページ
- name: local_government_code
  title: 全国地方公共団体コード
  description: 6桁の全国地方公共団体コード（元データの表記のまま。5桁の場合もある）
  annotations: { queria: { semantic: { role: entity, name: city } } }
- name: full_address
  title: 所在地
  description: 所在地の連結表記（旧形式の「住所」列を含む）
- name: latitude
  title: 緯度
- name: longitude
  title: 経度
- name: legal_entity_number
  title: 法人番号
  description: 所有者・管理者・保護団体等の法人番号（元データの表記のまま）
  annotations: { queria: { semantic: { role: entity, name: corporate_number } } }
