schema: ods
name: polling_place
title: 投票所
description: |-
  日野市が公開する「投票所一覧」（自治体標準オープンデータセット）です。投票所と投票区名を持ちます。期日前投票所は polling_place_type で区別します。データ時点は 2024-03-28 です。

  - 本体のファイルが持たない住所と座標は、施設情報ファイルと施設_ID で結合して補っています
keywords:
- 日野市
- 東京都
- 選挙
- 投票所
- 自治体標準オープンデータセット
- GIS
published: true
themes: [government_finance]
sources:
- path: https://www.city.hino.lg.jp/opendata/about/1026816/1026916.html
fields:
- name: municipality_code
  title: 全国地方公共団体コード
  description: 非推奨。local_government_code を使う
  semantic: { role: dimension }
- name: organization_name
  title: 地方公共団体名
- name: facility_id
  title: 施設ID
- name: polling_place_id
  title: 投票所ID
- name: voting_district_number
  title: 投票区番号
- name: name
  title: 名称
  description: 投票所（期日前投票所）の名称
- name: name_kana
  title: 名称カナ
- name: name_en
  title: 名称英字
- name: description
  title: 説明
- name: address
  title: 所在地
  description: 非推奨。full_address を使う
  semantic: { role: dimension }
- name: prefecture
  title: 都道府県
- name: city
  title: 市区町村
- name: ward
  title: 行政区
- name: town
  title: 町字
- name: town_id
  title: 町字ID
  description: 非推奨。street_address_id を使う
  semantic: { role: dimension }
- name: street_number
  title: 番地以下
- name: building_name
  title: 建物名等（方書）
- name: postal_code
  title: 郵便番号
  semantic: { role: entity, name: postal_code }
- name: phone_number
  title: 電話番号
- name: lat
  title: 緯度
  description: 非推奨。latitude を使う
  semantic: { role: dimension }
- name: lon
  title: 経度
  description: 非推奨。longitude を使う
  semantic: { role: dimension }
- name: geo_lat
  title: 緯度（地図表示用）
  description: 地図表示用の緯度（Queria が付与）。由来は geo_source
- name: geo_lon
  title: 経度（地図表示用）
  description: Queria が付与。geo_lat と対になる経度
- name: geo_source
  title: 座標の由来
  description: source=原典のまま、source_swapped=緯度と経度を入れ替えた値、NULL=座標なし
- name: geo_level
  title: 座標の粒度
  description: 原典由来のため source 固定
- name: geometry
  title: ジオメトリ
  description: Queria が付与。geo_lat / geo_lon から作った POINT。座標が無い行は NULL
- name: crs
  title: 座標参照系
- name: crs_code
  title: 座標参照系コード
- name: polling_place_type
  title: 投票所区分
  description: 「投票所」「期日前投票所」等の区分
- name: voting_district
  title: 投票区名
- name: election_type
  title: 選挙区分
- name: notes
  title: 備考
- name: extras
  title: 追加列
  description: 標準列にマッピングできなかった元データの列（JSON）
- name: as_of
  title: データ時点
  description: 日野市が公開ページに掲げている値。取得日ではない
- name: source_url
  title: 取得元URL
- name: source_page
  title: 公開ページ
  description: 日野市サイト上の、このデータの公開ページ
- name: local_government_code
  title: 全国地方公共団体コード
  semantic: { role: entity, name: city }
- name: full_address
  title: 所在地
- name: latitude
  title: 緯度
- name: longitude
  title: 経度
- name: street_address_id
  title: 町字ID
  semantic: { role: entity, name: town }
