schema: ods
name: polling_place
title: 投票所
description: 日野市が公開する「投票所一覧」（自治体標準オープンデータセット）。選挙の投票所を投票区名とともに収録する。期日前投票所は投票所区分（polling_place_type）で区別する。本体ファイルは住所と座標を持たず、併走する施設情報ファイル（132128_facility.csv）側にあるため、施設_ID
  で結合して補っている。データ時点は 2024-03-28（日野市が公開ページに掲げている値）。
keywords:
- 日野市
- 東京都
- 選挙
- 投票所
- 自治体標準オープンデータセット
- GIS
published: true
sources:
- path: https://www.city.hino.lg.jp/opendata/about/1026816/1026916.html
