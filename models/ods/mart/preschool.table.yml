schema: ods
name: preschool
title: 子育て施設
description: 日野市が公開する「子育て施設一覧」（自治体標準オープンデータセット）。保育園・幼稚園などの施設種別・収容定員・受入年齢・一時預かり/病児保育の有無を持つ。データ時点は 2024-03-28（日野市が公開ページに掲げている値）。
keywords:
- 日野市
- 東京都
- 子育て
- 保育所
- 自治体標準オープンデータセット
- GIS
published: true
sources:
- path: https://www.city.hino.lg.jp/opendata/about/1026816/1026903.html
fields:
- name: municipality_code
  title: 全国地方公共団体コード
  semantic: { role: entity, name: city }
- name: facility_id
  title: ID
  description: 日野市が採番した施設ID。定義書Bの施設情報ファイルとの結合キーでもある。実データでは全行に入っており、テーブル内で一意（2026-09-11 時点の実測）
- name: name
  title: 名称
- name: name_kana
  title: 名称カナ
- name: facility_type
  title: 種別
  description: 施設の種別（認可保育所・認定こども園・幼稚園等、元データの表記のまま）
- name: address
  title: 所在地
- name: prefecture
  title: 都道府県
- name: city
  title: 市区町村
- name: postal_code
  title: 郵便番号
  semantic: { role: entity, name: postal_code }
- name: phone_number
  title: 電話番号
- name: lat
  title: 緯度
- name: lon
  title: 経度
- name: geo_lat
  title: 緯度（地図表示用）
  description: Queria が付与。原典の緯度経度が使えればその値、緯度と経度が入れ替わっていれば入れ替えた値。採用できなければ NULL。由来は geo_source を見る
- name: geo_lon
  title: 経度（地図表示用）
  description: Queria が付与。geo_lat と対になる経度
- name: geo_source
  title: 座標の由来
  description: source=原典の緯度経度をそのまま採用、source_swapped=原典で緯度と経度が入れ替わっていたので入れ替えて採用、NULL=採用できる座標が無い
- name: geo_level
  title: 座標の粒度
  description: 原典由来のため source 固定
- name: geometry
  title: ジオメトリ
  description: Queria が付与。geo_lat / geo_lon から作った POINT。座標が無い行は NULL
- name: access
  title: アクセス方法
- name: parking
  title: 駐車場情報
- name: corporate_name
  title: 団体名
  description: 運営法人名
- name: capacity
  title: 収容定員
  description: 人。数値化できない表記は NULL
- name: age_range
  title: 受入年齢
- name: available_days
  title: 利用可能曜日
- name: start_time
  title: 開始時間
- name: end_time
  title: 終了時間
- name: available_notes
  title: 利用可能日時特記事項
- name: temporary_care
  title: 一時預かり
  description: 有=true、無=false、不明=NULL
- name: sick_care
  title: 病児保育
  description: 有=true、無=false、不明=NULL
- name: url
  title: URL
- name: notes
  title: 備考
- name: extras
  title: 追加列
  description: 標準列にマッピングできなかった元データの列（JSON）
- name: as_of
  title: データ時点
  description: 日野市が公開ページに掲げている値。取得日ではない
- name: source_url
  title: 取得元URL
- name: source_page
  title: 公開ページ
  description: 日野市サイト上の、このデータの公開ページ
